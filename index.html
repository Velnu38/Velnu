<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta name="theme-color" content="#0f2747"/>
    <meta name="description" content="Finviant Office helps service businesses organize customers, create branded estimates and invoices, and spend less time on paperwork. Free plan and private beta available; AI features in development."/>
    <meta name="application-name" content="Finviant Office"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" type="image/svg+xml" href="/finviant-mark.svg"/>
    <title>Finviant Office — AI Business Assistant</title>
    <style>
      #startup-loading { margin: 12vh auto; max-width: 30rem; padding: 1.5rem; color: #0f2747; font: 16px/1.5 system-ui, sans-serif; }
      #startup-recovery { position: fixed; z-index: 10000; bottom: 1rem; left: 1rem; right: 1rem; max-width: 36rem; margin: auto; padding: 1.25rem; border: 1px solid #cbd5e1; border-radius: .75rem; background: white; color: #0f2747; box-shadow: 0 8px 32px #0f274733; font: 16px/1.5 system-ui, sans-serif; }
      #startup-recovery[hidden], #startup-loading[hidden] { display: none; }
      #startup-recovery h2 { margin: 0 0 .5rem; font: 600 1.1rem/1.4 system-ui, sans-serif; }
      #startup-recovery p { margin: 0 0 1rem; }
      #startup-recovery button { padding: .65rem 1rem; border: 1px solid #0f2747; border-radius: .4rem; background: #0f2747; color: white; font: inherit; cursor: pointer; }
      #startup-recovery button + button { margin-left: .5rem; background: white; color: #0f2747; }
    </style>
  </head>
  <body>
    <div id="root">
      <section id="startup-loading" role="status">
        <h1>Finviant Office</h1>
        <p>Opening your workspace…</p>
        <p>If this screen stays here, reload this browser tab.</p>
      </section>
    </div>
    <section id="startup-recovery" role="alert" hidden>
      <h2>Finviant couldn’t finish loading</h2>
      <p id="startup-recovery-message">Check your connection, then reload Finviant.</p>
      <p id="startup-diagnostic" hidden style="font-size:.85rem;overflow-wrap:anywhere;white-space:pre-line"></p>
      <button id="startup-reload" type="button">Reload Finviant</button>
      <button id="startup-check" type="button">Check loading</button>
      <button id="startup-dismiss" type="button" hidden>Keep working</button>
    </section>
    <noscript>Finviant needs JavaScript to open your workspace. Enable JavaScript in your browser, then reload this page.</noscript>
    <script src="/startup-recovery.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
