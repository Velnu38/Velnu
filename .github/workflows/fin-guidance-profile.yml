name: Fin offline guidance and query profile
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['supabase/functions/fin-workflow/productKnowledge.ts', 'tests/settings/fin-guidance-offline.test.ts', 'scripts/qa/profile-record-queries.mjs', '.github/workflows/fin-guidance-profile.yml']
permissions:
  contents: read
concurrency:
  group: fin-guidance-profile-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test --test-concurrency=1 tests/settings/fin-product-knowledge.test.ts tests/settings/fin-guidance-offline.test.ts tests/settings/fin-navigation.test.ts tests/settings/fin-workflow.test.ts tests/settings/fin-account-database.test.ts
      - run: node scripts/qa/profile-record-queries.mjs
      - run: npm run assessment:check && npm run assessment:test
      - name: Typed and synthetic speech navigation — no real providers
        run: npx playwright test tests/e2e/fin-navigation.spec.mjs --workers=1
        env:
          FINVIANT_TEST_CHANNEL: chrome
