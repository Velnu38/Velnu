name: Revised Home visual review
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: [src/components/AppShell.tsx, src/pages/DashboardPage.tsx, src/components/HomeAttention.tsx, src/components/home-revised.css, src/components/FinancialPerformance.tsx, src/components/FinancialInsights.tsx, src/components/calendar/DailyCalendar.tsx, tests/e2e/home-revised.spec.mjs, tests/e2e/home-screen.spec.mjs, .github/workflows/home-revised-review.yml]
permissions:
  contents: read
concurrency:
  group: home-revised-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  home:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Approved Home cards, destinations, accessibility and permissions
        run: npx playwright test tests/e2e/home-revised.spec.mjs tests/e2e/home-screen.spec.mjs --config=${{ matrix.engine == 'webkit' && 'playwright.mobile.config.mjs' || 'playwright.config.mjs' }} --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: home-revised-${{ matrix.engine }}
          path: |
            tmp/home-revised/
            test-results/
          retention-days: 7
