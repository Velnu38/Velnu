name: Radix shared record UI checks
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['src/components/RecordDetail.tsx', 'src/components/record-detail.css', 'tests/ui/**', 'tests/operations/preview.tsx', 'tests/e2e/radix-record-tabs.spec.mjs', 'tests/settings/record-detail-dom.mjs', 'package.json', 'package-lock.json', '.github/workflows/radix-ui-checks.yml']
permissions:
  contents: read
concurrency:
  group: radix-ui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  record-ui:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check keyboard navigation, retained drafts and document actions with synthetic data
        run: npx playwright test tests/e2e/radix-record-tabs.spec.mjs tests/e2e/document-calendar-contacts.spec.mjs --config=${{ matrix.engine == 'webkit' && 'playwright.mobile.config.mjs' || 'playwright.config.mjs' }} --workers=2
      - name: Annotate failed browser assertions
        if: failure()
        run: node scripts/qa/annotate-browser-failures.mjs ${{ matrix.engine == 'webkit' && 'test-results/mobile-results.json' || 'test-results/results.json' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: radix-record-ui-${{ matrix.engine }}
          path: |
            work/radix-ui/
            test-results/
          retention-days: 7
