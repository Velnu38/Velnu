name: Trial readiness checks
on:
  pull_request:
    branches: [main, feature/velnu-stage1]
  push:
    branches: [main, feature/velnu-stage1]
permissions:
  contents: read
concurrency:
  group: trial-checks-stable-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Use installed Chrome or perform a bounded browser installation
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'FINVIANT_TEST_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            timeout 180s npx playwright install --with-deps chromium
          fi
      - name: Full browser regression checks (mock services only; no tests omitted)
        run: npx playwright test
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Financial input, workbook completeness, and scheduling unit tests
        run: deno test tests/unit/
      - name: Check invoice email backend
        run: deno check --node-modules-dir=auto supabase/functions/send-invoice-email/index.ts
      - name: Backend regression checks (mock services only)
        run: deno test --node-modules-dir=auto --allow-env supabase/functions/send-invoice-email/index_test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trial-check-results
          path: test-results/
          retention-days: 3
