name: Workspace scheme visual review
on:
  push:
    branches: [ux/app-wide-job-scheme-20261112]
  pull_request:
    branches: [ux/private-testing-20261029]
permissions:
  contents: read
concurrency:
  group: workspace-visual-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Render main pages, subsequent tabs and editors
        run: npx playwright test tests/e2e/workspace-scheme.spec.mjs tests/e2e/job-phone-flow.spec.mjs --config=${{ matrix.engine == 'webkit' && 'playwright.mobile.config.mjs' || 'playwright.config.mjs' }} --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-visual-${{ matrix.engine }}
          path: |
            tmp/workspace-review/
            tmp/ux-review/
            test-results/
          retention-days: 7
