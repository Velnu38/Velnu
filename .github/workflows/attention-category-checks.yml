name: Needs Attention checks
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['src/components/BillingHub.tsx', 'src/services/dashboardAttention.ts', 'tests/e2e/attention-fixture.mjs', 'tests/scheduling/attention-categories.test.ts', '.github/workflows/attention-category-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/scheduling/attention-categories.test.ts
      - run: npx playwright test tests/e2e/critical-dashboard-schedule.spec.mjs --grep 'attention category buttons'
        env:
          FINVIANT_TEST_CHANNEL: chrome
