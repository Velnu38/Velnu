name: Jobs directory visual review
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths:
      - src/pages/JobsPage.tsx
      - src/components/jobs-directory.css
      - src/components/RecordListControls.tsx
      - tests/e2e/jobs-mockup-visual.spec.mjs
      - tests/e2e/job-directory-fixture.mjs
      - .github/workflows/jobs-directory-visual-review.yml
permissions:
  contents: read
concurrency:
  group: jobs-directory-visual-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  jobs:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compare Jobs tab states against phone mockups
        run: npx playwright test tests/e2e/jobs-mockup-visual.spec.mjs --config=${{ matrix.engine == 'webkit' && 'playwright.mobile.config.mjs' || 'playwright.config.mjs' }} --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jobs-directory-${{ matrix.engine }}
          path: |
            tmp/jobs-directory-review/
            test-results/
          retention-days: 7
