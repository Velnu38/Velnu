name: Apply reviewed recovery patch
on:
  push:
    branches: [feature/velnu-stage1]
    paths: ['.github/workflows/apply-recovery-patch.yml']
permissions:
  contents: read
jobs:
  apply-and-verify:
    if: github.repository == 'Velnu38/Velnu' && github.ref == 'refs/heads/feature/velnu-stage1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed changes (fail on source drift)
        run: |
          python .github/reliability/apply_recovery.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/services/jobs.ts');s=p.read_text();s=s.replace("supabase.rpc('create_job_atomic',", "supabase.rpc(input.scheduled_start ? 'create_scheduled_job' : 'create_job_atomic',");p.write_text(s)
          p=Path('supabase/functions/ai-command/index.ts');s=p.read_text();s=s.replace('const body=await req.json();const businessId=', 'const body=await req.json();if(!body||typeof body!=="object"||Array.isArray(body))return respond(400,{error:"Invalid request"});const businessId=');p.write_text(s)
          p=Path('src/components/VoiceAssistant.tsx');s=p.read_text();s=s.replace("if (recorder.state === 'recording') recorder.stop()", "if (recorder.state === 'recording') { try { recorder.stop() } catch { /* Already stopped. */ } }");s=s.replace('speech.onerror = null; speech.stop()', 'speech.onerror = null; try { speech.stop() } catch { /* Already stopped. */ }');p.write_text(s)
          PY
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npx tsc supabase/functions/_shared/providerRequest.ts --target ES2022 --module ES2022 --lib ES2022,DOM --strict --skipLibCheck --outDir .recovery-build
      - run: node --test tests/recovery/providerRequest.test.mjs
      - run: npm install --no-save --ignore-scripts @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Full browser regression, including recovery tests
        run: npx playwright test
      - name: Commit only reviewed application files to the same development branch
        run: |
          git diff --check
          git config user.name 'Finviant Recovery Checks'
          git config user.email 'recovery-checks@users.noreply.github.com'
          git add src/services/jobs.ts src/components/VoiceAssistant.tsx src/pages/JobsPage.tsx supabase/functions/ai-command/index.ts supabase/functions/transcribe-voice/index.ts vercel.json
          git commit -m 'Apply verified bounded AI calls, atomic job workflows and recoverable browser actions'
          git push origin HEAD:refs/heads/feature/velnu-stage1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-recovery-browser-results
          path: test-results/
          retention-days: 3
