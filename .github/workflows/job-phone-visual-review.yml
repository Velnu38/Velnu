name: Focused phone visual review
on:
  push:
    branches: [ux/job-phone-shell-width-20261112]
permissions:
  contents: read
concurrency:
  group: phone-visual-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused phone navigation and rendered screens
        run: npx playwright test tests/e2e/job-phone-flow.spec.mjs tests/e2e/ux-journey.spec.mjs --config=${{ matrix.engine == 'webkit' && 'playwright.mobile.config.mjs' || 'playwright.config.mjs' }} --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phone-visual-${{ matrix.engine }}
          path: |
            tmp/ux-review/
            test-results/
          retention-days: 7
