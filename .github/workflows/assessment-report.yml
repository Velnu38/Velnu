name: Finviant assessment maintenance
on:
  push:
    branches: [ux/private-testing-20261029]
    paths:
      [
        "src/**",
        "server/**",
        "api/**",
        "supabase/**",
        "docs/launch-readiness.json",
        "scripts/assessment/**",
        "tests/assessment/**",
        "package.json",
        "AGENTS.md",
        ".github/workflows/assessment-report.yml",
      ]
  pull_request:
    branches: [ux/private-testing-20261029]
    paths:
      [
        "docs/launch-readiness.json",
        "ASSESSMENT_REPORT.md",
        "scripts/assessment/**",
        "tests/assessment/**",
        "package.json",
        "AGENTS.md",
        ".github/workflows/assessment-report.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assessment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test tests/assessment/*.test.mjs
      - run: node scripts/assessment/report.mjs --check
        if: github.event_name == 'pull_request'
  regenerate:
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'Velnu38/Velnu' && github.ref == 'refs/heads/ux/private-testing-20261029'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node scripts/assessment/report.mjs
      - run: node scripts/assessment/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
