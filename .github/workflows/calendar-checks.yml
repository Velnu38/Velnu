name: Calendar integration checks
on:
  push:
    branches: ['feature/calendar-dashboard-20261102', 'ux/private-testing-20261029']
  pull_request:
    paths: ['server/calendar/**', 'api/calendar*', 'src/components/calendar/**', 'src/services/calendar.ts', 'supabase/migrations/*calendar*', 'tests/calendar/**']
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:calendar && npm run test:calendar && npm run build
      - name: Calendar browser regressions with installed Chrome
        run: npx playwright test tests/e2e/critical-dashboard-schedule.spec.mjs --grep 'calendar dashboard|calendar settings|calendar widget'
        env:
          FINVIANT_TEST_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: calendar-browser-results
          path: test-results/
