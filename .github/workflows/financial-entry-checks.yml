name: Financial entry checks
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['src/components/Financial*', 'src/pages/BookkeepingPage.tsx', 'tests/e2e/financial-entry.spec.mjs', '.github/workflows/financial-entry-checks.yml']
permissions:
  contents: read
concurrency:
  group: financial-entry-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/settings/navigation.test.ts tests/settings/assistant-entry.test.ts
      - name: Financial entry browser checks
        run: npx playwright test tests/e2e/financial-entry.spec.mjs --workers=2
        env:
          FINVIANT_TEST_CHANNEL: chrome
