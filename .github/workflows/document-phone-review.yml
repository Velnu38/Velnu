name: Focused document mockup review
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: [src/components/document-phone.css, src/components/InvoiceDetail.tsx, src/pages/InvoicesPage.tsx, src/pages/EstimatesPage.tsx, tests/e2e/document-phone-mockups.spec.mjs, .github/workflows/document-phone-review.yml]
permissions:
  contents: read
concurrency:
  group: document-visual-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Document layout and preserved draft/history behavior
        run: npx playwright test tests/e2e/document-phone-mockups.spec.mjs tests/e2e/document-creation-preview.spec.mjs tests/e2e/invoice-reminder-history.spec.mjs --config=${{ matrix.engine == 'webkit' && 'playwright.mobile.config.mjs' || 'playwright.config.mjs' }} --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: document-visual-${{ matrix.engine }}
          path: |
            tmp/document-review/
            test-results/
          retention-days: 7
