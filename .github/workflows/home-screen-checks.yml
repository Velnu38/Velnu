name: Home screen checks
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['src/components/AppShell.tsx', 'src/components/WorkspaceIcon.tsx', 'src/components/FinancialPerformance.tsx', 'src/pages/DashboardPage.tsx', 'src/home-screen.css', 'src/pages/RemindersPage.tsx', 'tests/e2e/home-screen.spec.mjs', '.github/workflows/home-screen-checks.yml']
permissions:
  contents: read
concurrency:
  group: home-screen-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run test:services && npm run test:deployment && npm run typecheck:calendar
      - name: Home, navigation, calendar, financial and Fin regressions
        run: npx playwright test tests/e2e/home-screen.spec.mjs tests/e2e/professional-interface-audit.spec.mjs tests/e2e/unified-attention.spec.mjs tests/e2e/fin-conversation.spec.mjs tests/e2e/fin-direct-voice.spec.mjs tests/e2e/critical-dashboard-schedule.spec.mjs tests/e2e/document-calendar-contacts.spec.mjs tests/e2e/guided-scheduling.spec.mjs tests/e2e/google-maps.spec.mjs tests/e2e/recovery.spec.mjs tests/e2e/workflows.spec.mjs --grep 'Home |list opens|calendar widget fits|dashboard layout uses|matching customer property|job creation preserves|technician keeps|workspace route|creation from|one attention|interactive dashboard|Fin has one|one mobile tap|cancel releases native|spoken (yes|no)|selected day shows|tiles share|navigation returns|all attention actions|dashboard manual refresh|mobile dock' --workers=2
        env:
          FINVIANT_TEST_CHANNEL: chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: home-screen-evidence
          path: test-results/
          retention-days: 7
