name: Pricing tier checks
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['src/**', 'server/**', 'supabase/**', 'tests/**', '.github/workflows/tier-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/tiers/*.test.ts tests/predictive/matching.test.ts tests/settings/fin-workflow.test.ts
      - run: npm run typecheck:calendar && npm run test:calendar && npm run test:storage && npm run test:deployment
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/pricing-tiers.spec.mjs tests/e2e/predictive-customers.spec.mjs tests/e2e/document-creation-preview.spec.mjs tests/e2e/business-profile.spec.mjs
