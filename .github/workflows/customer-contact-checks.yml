name: Customer contact checks
on:
  pull_request:
    branches: [ux/private-testing-20261029]
    paths: ['src/components/CustomerEditDialog.tsx', 'src/components/CustomerDetail.tsx', 'src/services/customers.ts', 'tests/e2e/customer-workspace.spec.mjs', '.github/workflows/customer-contact-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright test tests/e2e/customer-workspace.spec.mjs --grep 'delete contact'
        env:
          FINVIANT_TEST_CHANNEL: chrome
