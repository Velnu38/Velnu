name: Predictive customer checks
on:
  push:
    branches: [feature/predictive-customers-20261106, qa/finviant-release, ux/private-testing-20261029]
  pull_request:
    branches: [ux/private-testing-20261029]
    paths:
      - 'src/components/Customer*'
      - 'src/components/FinCustomerSuggestions.tsx'
      - 'src/components/VoiceAssistant.tsx'
      - 'src/lib/customerSuggestions.ts'
      - 'src/lib/voiceDocument.ts'
      - 'src/lib/quickInvoice.ts'
      - 'src/pages/InvoicesPage.tsx'
      - 'supabase/functions/fin-workflow/**'
      - 'tests/settings/fin-workflow.test.ts'
      - 'tests/settings/voice-document.test.ts'
      - 'tests/predictive/**'
      - 'tests/e2e/predictive-customers.spec.mjs'
      - '.github/workflows/predictive-customer-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/predictive/*.test.ts tests/settings/voice-document.test.ts tests/settings/fin-workflow.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/predictive-customers.spec.mjs tests/e2e/document-creation-preview.spec.mjs tests/e2e/voice-multiple-lines.spec.mjs
