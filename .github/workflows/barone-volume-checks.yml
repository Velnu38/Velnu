name: Barone volume regression
on:
  push:
    branches: [qa/barone-stress-20261102]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:deployment && npm run test:services && npm run test:calendar && npm run test:settings && npm run test:records && npm run typecheck:calendar && npm run build
      - run: node tests/stress/volume-services.mjs && node --import tsx --test tests/stress/historical-dates.test.ts
      - name: Dashboard and document browser regressions
        run: npx playwright test tests/e2e/critical-dashboard-schedule.spec.mjs --grep 'calendar dashboard|calendar settings|calendar widget|record resources|dashboard layout|billing hub|dashboard tenant|failed invoice-summary|dashboard manual refresh|absent customer|navigation during|empty dashboard|owner settings|interactive dashboard|volume lists'
        env:
          FINVIANT_TEST_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref != 'review/finviant-integration-20261109'
        with:
          name: barone-qa-results
          path: |
            test-results/
            qa-results/
          retention-days: 7
